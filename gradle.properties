org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Off until the Room/KSP setup is settled (chunk 2), then worth turning on.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# R8 full mode stays ON (the AGP default). Unlike PDF Toolkit there is no
# reflective dependency here - nothing in this app resolves types at runtime.
